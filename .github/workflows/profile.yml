# 3D草グラフ と ブートログSVG を生成して main にコミットする。
#
# snake.yml と違い、生成物を main に直接置くので push トリガーは付けない
# （自分のコミットで自分が再発火する無限ループを避けるため）。
# 初回は Actions タブから手動実行すること。

name: generate profile assets

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # profile-3d-contrib/ 以下に night-view / gitblock など複数のSVGが出る
      - name: generate 3d contribution svg
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: generate boot log svg
        run: node scripts/bootlog.mjs "${{ github.repository_owner }}" assets/bootlog.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A profile-3d-contrib assets
          git diff --staged --quiet && echo "no change" && exit 0
          git commit -m "chore: regenerate profile assets"
          git push
