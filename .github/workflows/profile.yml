# ヘッダーとブートログのSVGを生成して main にコミットする。
#
# 生成物を main に置くので push トリガーは付けない（自分のコミットで再発火するため）。
# 初回や、スクリプトを編集したあとは Actions タブから手動実行する。

name: generate profile assets

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # ヘッダー。APIを使わないので毎回同じ結果になる
      - name: generate header svg
        run: node scripts/brand.mjs

      - name: generate boot log svg
        run: node scripts/bootlog.mjs "${{ github.repository_owner }}" assets/bootlog.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "chore: regenerate profile assets"
            git pull --rebase --autostash origin main
            git push
          fi
