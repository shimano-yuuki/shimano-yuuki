# 来訪者が Issue を立てるとBotがじゃんけんを返し、READMEの戦績を更新して Issue を閉じる。
# timburgan/timburgan（Issueでチェスを指す）と同じ仕組み。
#
# Issueタイトルは誰でも自由に書ける文字列なので、run: に ${{ ... }} で直接埋めず
# 必ず env 経由で渡すこと（埋めるとコマンドインジェクションになる）。

name: janken

on:
  issues:
    types: [opened]

# 同時に複数のIssueが立っても push が衝突しないよう直列化する
concurrency:
  group: janken
  cancel-in-progress: false

jobs:
  play:
    if: startsWith(github.event.issue.title, 'janken:')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: play
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.repository }}
        run: node scripts/janken.mjs

      - name: commit
        env:
          ISSUE_USER: ${{ github.event.issue.user.login }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A README.md data
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "chore: janken vs @$ISSUE_USER"
            git pull --rebase --autostash origin main
            git push
          fi

      - name: reply and close
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE" --body-file data/last-comment.md
          gh issue close "$ISSUE"
