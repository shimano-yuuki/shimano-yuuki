<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320" role="img" aria-label="shimano-yuuki boot log">
  <style>
  :root {
    --fg: #1f2328;
    --muted: #59636e;
    --accent: #1a7f37;
    --line: #d1d9e0;
    --faint: #eaeef2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fg: #e6edf3;
      --muted: #8b949e;
      --accent: #39d353;
      --line: #30363d;
      --faint: #21262d;
    }
  }
    .ln, .prompt, .head { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 14px; }
    .mark { fill: var(--accent); }
    .key  { fill: var(--muted); }
    .dot  { fill: var(--line); }
    .val  { fill: var(--fg); font-weight: 600; }
    .head { font-size: 11px; letter-spacing: 2px; fill: var(--muted); }
    .ln { opacity: 0; animation: reveal 0.01s linear forwards; }
    .l0 { animation-delay: 0.20s; }
    .l1 { animation-delay: 0.33s; }
    .l2 { animation-delay: 0.46s; }
    .l3 { animation-delay: 0.59s; }
    .l4 { animation-delay: 0.72s; }
    .l5 { animation-delay: 0.85s; }
    .l6 { animation-delay: 0.98s; }
    .l7 { animation-delay: 1.11s; }
    .l8 { animation-delay: 1.24s; }
    @keyframes reveal { to { opacity: 1; } }
    .cursor { fill: var(--accent); opacity: 0; animation: blink 1.1s steps(1) infinite; animation-delay: 1.37s; }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    .frame { fill: none; stroke: var(--line); }
    .sep { stroke: var(--line); }
  </style>
  <rect class="frame" x="0.5" y="0.5" width="719" height="319" rx="8" />
  <line class="sep" x1="0" y1="38" x2="720" y2="38" />
  <text class="head" x="26" y="23">SHIMANO-YUUKI / BOOT</text>
    <text class="ln l0" x="26" y="78" xml:space="preserve"><tspan class="mark">&gt; </tspan><tspan class="key">mounting /dev/shimano-yuuki</tspan> <tspan class="dot">.........................</tspan> <tspan class="val">OK</tspan></text>
    <text class="ln l1" x="26" y="100" xml:space="preserve"><tspan class="mark">&gt; </tspan><tspan class="key">repositories</tspan> <tspan class="dot">........................................</tspan> <tspan class="val">18</tspan></text>
    <text class="ln l2" x="26" y="122" xml:space="preserve"><tspan class="mark">&gt; </tspan><tspan class="key">primary language</tspan> <tspan class="dot">............................</tspan> <tspan class="val">Dart 74.5%</tspan></text>
    <text class="ln l3" x="26" y="144" xml:space="preserve"><tspan class="mark">&gt; </tspan><tspan class="key">active stack</tspan> <tspan class="dot">......</tspan> <tspan class="val">Dart / TypeScript / PHP / JavaScript</tspan></text>
    <text class="ln l4" x="26" y="166" xml:space="preserve"><tspan class="mark">&gt; </tspan><tspan class="key">commits (1y)</tspan> <tspan class="dot">.......................................</tspan> <tspan class="val">257</tspan></text>
    <text class="ln l5" x="26" y="188" xml:space="preserve"><tspan class="mark">&gt; </tspan><tspan class="key">pull requests (1y)</tspan> <tspan class="dot">..................................</tspan> <tspan class="val">30</tspan></text>
    <text class="ln l6" x="26" y="210" xml:space="preserve"><tspan class="mark">&gt; </tspan><tspan class="key">stars earned</tspan> <tspan class="dot">.........................................</tspan> <tspan class="val">9</tspan></text>
    <text class="ln l7" x="26" y="232" xml:space="preserve"><tspan class="mark">&gt; </tspan><tspan class="key">last push</tspan> <tspan class="dot">.......................</tspan> <tspan class="val">4h ago · shimano-yuuki</tspan></text>
    <text class="ln l8" x="26" y="254" xml:space="preserve"><tspan class="mark">&gt; </tspan><tspan class="key">uptime</tspan> <tspan class="dot">......................................</tspan> <tspan class="val">1,793 days</tspan></text>
  <text class="ln l8 prompt" x="26" y="284" xml:space="preserve"><tspan class="mark">&gt; </tspan><tspan class="val">READY</tspan></text>
  <rect class="cursor" x="93.2" y="273" width="8" height="15" />
</svg>
