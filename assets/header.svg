<svg xmlns="http://www.w3.org/2000/svg" width="880" height="168" viewBox="0 0 880 168" role="img" aria-label="shimano yuuki">
  <style>
  :root {
    --fg: #1f2328;
    --muted: #59636e;
    --accent: #1a7f37;
    --line: #d1d9e0;
    --faint: #eaeef2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fg: #e6edf3;
      --muted: #8b949e;
      --accent: #39d353;
      --line: #30363d;
      --faint: #21262d;
    }
  }
    text { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    .ch {
      font-size: 40px; font-weight: 600; fill: var(--fg);
      opacity: 0; transform: translateY(8px);
      animation: rise .55s cubic-bezier(.2,.7,.3,1) forwards;
    }
    @keyframes rise { to { opacity: 1; transform: translateY(0); } }

    .caret { fill: var(--accent); opacity: 0; animation: blink 1.1s steps(1) infinite; animation-delay: 0.98s; }
    @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }

    .rule { stroke: var(--accent); stroke-width: 1.5; stroke-dasharray: 300; stroke-dashoffset: 300;
      animation: draw .9s cubic-bezier(.3,.8,.3,1) forwards; animation-delay: 0.73s; }
    @keyframes draw { to { stroke-dashoffset: 0; } }

    .tag { font-size: 13px; letter-spacing: 4px; fill: var(--muted); text-anchor: middle;
      opacity: 0; animation: fade .8s ease forwards; animation-delay: 1.14s; }
    @keyframes fade { to { opacity: 1; } }
  </style>
  <text class="ch" x="254.0" y="84" style="animation-delay:0.000s">s</text>
  <text class="ch" x="283.0" y="84" style="animation-delay:0.045s">h</text>
  <text class="ch" x="312.0" y="84" style="animation-delay:0.090s">i</text>
  <text class="ch" x="341.0" y="84" style="animation-delay:0.135s">m</text>
  <text class="ch" x="370.0" y="84" style="animation-delay:0.180s">a</text>
  <text class="ch" x="399.0" y="84" style="animation-delay:0.225s">n</text>
  <text class="ch" x="428.0" y="84" style="animation-delay:0.270s">o</text>
  <text class="ch" x="486.0" y="84" style="animation-delay:0.360s">y</text>
  <text class="ch" x="515.0" y="84" style="animation-delay:0.405s">u</text>
  <text class="ch" x="544.0" y="84" style="animation-delay:0.450s">u</text>
  <text class="ch" x="573.0" y="84" style="animation-delay:0.495s">k</text>
  <text class="ch" x="602.0" y="84" style="animation-delay:0.540s">i</text>
  <rect class="caret" x="635.0" y="52" width="4" height="34" />
  <line class="rule" x1="290" y1="112" x2="590" y2="112" />
  <text class="tag" x="440" y="140">BUILDING QUIET, SOLID THINGS</text>
</svg>
