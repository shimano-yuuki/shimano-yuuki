<svg xmlns="http://www.w3.org/2000/svg" width="880" height="142" viewBox="0 0 880 142" role="img" aria-label="stack">
  <style>
  :root {
    --fg: #1f2328;
    --muted: #59636e;
    --accent: #1a7f37;
    --line: #d1d9e0;
    --faint: #eaeef2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fg: #e6edf3;
      --muted: #8b949e;
      --accent: #39d353;
      --line: #30363d;
      --faint: #21262d;
    }
  }
    text { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 14px; }
    .label { fill: var(--muted); letter-spacing: 2px; font-size: 11px; }
    .item  { fill: var(--fg); }
    .sep   { fill: var(--line); }
    .row { opacity: 0; transform: translateX(-6px); animation: slide .6s cubic-bezier(.2,.7,.3,1) forwards; }
    @keyframes slide { to { opacity: 1; transform: translateX(0); } }
    .divider { stroke: var(--line); stroke-width: 1; stroke-dasharray: 142; stroke-dashoffset: 142;
      animation: draw 1s ease forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
  </style>
  <line class="divider" x1="164" y1="14" x2="164" y2="128" />
  <g class="row" style="animation-delay:0.15s">
    <text class="label" x="40" y="34">LANGUAGES</text>
    <text class="items" x="190" y="34" xml:space="preserve"><tspan class="item">Dart</tspan><tspan class="sep">  ·  </tspan><tspan class="item">TypeScript</tspan><tspan class="sep">  ·  </tspan><tspan class="item">Go</tspan><tspan class="sep">  ·  </tspan><tspan class="item">PHP</tspan></text>
  </g>
  <g class="row" style="animation-delay:0.29s">
    <text class="label" x="40" y="68">FRAMEWORKS</text>
    <text class="items" x="190" y="68" xml:space="preserve"><tspan class="item">Flutter</tspan><tspan class="sep">  ·  </tspan><tspan class="item">Next.js</tspan><tspan class="sep">  ·  </tspan><tspan class="item">React</tspan><tspan class="sep">  ·  </tspan><tspan class="item">Tailwind</tspan></text>
  </g>
  <g class="row" style="animation-delay:0.43s">
    <text class="label" x="40" y="102">INFRA</text>
    <text class="items" x="190" y="102" xml:space="preserve"><tspan class="item">Firebase</tspan><tspan class="sep">  ·  </tspan><tspan class="item">PostgreSQL</tspan><tspan class="sep">  ·  </tspan><tspan class="item">MySQL</tspan><tspan class="sep">  ·  </tspan><tspan class="item">Docker</tspan></text>
  </g>
</svg>
